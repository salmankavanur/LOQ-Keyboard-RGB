name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and repository
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.TrimStart('v').Split('-')[0] }
          $parts = $version.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $v4 = ($parts[0..3]) -join '.'
          $f = 'src/AssemblyInfo.cs'
          (Get-Content $f) -replace '"1\.0\.0\.0"', "`"$v4`"" | Set-Content $f
          Add-Content $f "[assembly: AssemblyMetadata(`"RepositoryUrl`", `"https://github.com/$env:GITHUB_REPOSITORY`")]"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version $version ($v4), repository $env:GITHUB_REPOSITORY"

      - name: Build app
        shell: cmd
        run: build.cmd

      - name: Build setup
        shell: pwsh
        run: |
          $candidates = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          & $iscc installer\setup.iss "/DAppVersion=$env:APP_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item bin\LOQKeyboardRGB.exe "dist\LOQKeyboardRGB-$env:APP_VERSION-portable.exe"
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N0} KB  SHA256 {2}" -f $_.Name, ($_.Length / 1KB), (Get-FileHash $_.FullName).Hash }

      - uses: actions/upload-artifact@v4
        with:
          name: LOQKeyboardRGB-${{ env.APP_VERSION }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:APP_VERSION
          $hashes = Get-ChildItem dist | ForEach-Object { "| ``{0}`` | ``{1}`` |" -f $_.Name, (Get-FileHash $_.FullName).Hash.ToLower() }
          $notes = @(
            "## Download",
            "",
            "- **LOQKeyboardRGB-Setup-$v.exe**: recommended. Installs for your user account (no admin rights), adds a Start menu entry, optional desktop shortcut and *Start with Windows*, and an uninstaller in Settings → Apps.",
            "- **LOQKeyboardRGB-$v-portable.exe**: a single exe with no installation.",
            "",
            "Requires Windows 10/11 and a Lenovo laptop with a 4-zone RGB keyboard (e.g. LOQ 15IRX9).",
            "",
            "> Windows SmartScreen may show *Windows protected your PC* because the files aren't code-signed. Click **More info → Run anyway**.",
            "",
            "| File | SHA-256 |",
            "|---|---|"
          ) + $hashes
          Set-Content release-notes.md ($notes -join "`n")
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist).FullName --title "LOQ Keyboard RGB $env:GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes
